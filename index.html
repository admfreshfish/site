<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Fish Digital — Opah</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #F5F3EE; color: #1A1A1A; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 60px; background: #F5F3EE; border-bottom: 0.5px solid #ddd; position: sticky; top: 0; z-index: 100; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a { font-size: 12px; letter-spacing: 1.5px; color: #888; text-decoration: none; text-transform: uppercase; }
.nav-links a:hover { color: #1A1A1A; }
.nav-right { display: flex; align-items: center; gap: 20px; }
.nav-cta { background: #B01020; color: white; border: none; padding: 10px 22px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-radius: 24px; cursor: pointer; }

/* Language switcher */
.lang-switcher { display: flex; gap: 6px; align-items: center; }
.lang-btn { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; border: 0.5px solid #ccc; background: transparent; color: #888; padding: 5px 10px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
.lang-btn:hover { color: #1A1A1A; border-color: #999; }
.lang-btn.active { border-color: #B01020; color: #B01020; background: transparent; }

.hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 60px; min-height: 86vh; gap: 40px; }
.hero-left { flex: 1; max-width: 500px; }
.eyebrow { font-size: 12px; letter-spacing: 4px; color: #B01020; text-transform: uppercase; margin-bottom: 24px; }
.hero-title { font-size: 54px; font-weight: 200; line-height: 1.1; letter-spacing: -1px; margin-bottom: 24px; }
.hero-title em { font-style: italic; color: #B01020; }
.hero-desc { font-size: 17px; font-weight: 300; color: #555; line-height: 1.9; margin-bottom: 40px; max-width: 400px; }
.hero-actions { display: flex; gap: 16px; align-items: center; }
.btn-dark { background: #1A1A1A; color: white; border: none; padding: 14px 28px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-radius: 32px; cursor: pointer; }
.btn-ghost { font-size: 12px; letter-spacing: 1.5px; color: #888; text-transform: uppercase; border-bottom: 0.5px solid #ccc; padding-bottom: 2px; cursor: pointer; }
.hero-right { flex: 1; display: flex; justify-content: center; }
.phone { width: 210px; height: 420px; background: #F5F3EE; border-radius: 34px; border: 6px solid #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 20px 20px 0 #E0DDD4; }
.phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 72px; height: 18px; background: #1A1A1A; border-radius: 0 0 12px 12px; }
.phone-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16px; }
.phone-name { font-size: 24px; font-weight: 100; letter-spacing: 8px; margin-top: 12px; margin-bottom: 8px; }
.phone-tag { font-size: 9px; letter-spacing: 1px; color: #aaa; line-height: 1.6; }
.divider { height: 0.5px; background: #ddd; margin: 0 60px; }
.section { padding: 72px 60px; }
.sec-label { font-size: 11px; letter-spacing: 4px; color: #B01020; text-transform: uppercase; margin-bottom: 14px; }
.sec-title { font-size: 36px; font-weight: 200; line-height: 1.2; margin-bottom: 18px; max-width: 580px; }
.sec-desc { font-size: 17px; font-weight: 300; color: #555; line-height: 1.9; max-width: 520px; margin-bottom: 44px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #ddd; border: 0.5px solid #ddd; }
.card { background: #F5F3EE; padding: 32px 28px; }
.card-icon { width: 32px; height: 32px; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 400; margin-bottom: 10px; }
.card-text { font-size: 15px; font-weight: 300; color: #777; line-height: 1.8; }
.dark { background: #1A1A1A; color: white; padding: 72px 60px; }
.dark-inner { display: flex; gap: 80px; }
.dark-label { font-size: 11px; letter-spacing: 4px; color: #B01020; text-transform: uppercase; margin-bottom: 14px; }
.dark-title { font-size: 34px; font-weight: 200; line-height: 1.2; color: white; }
.dark-title em { font-style: italic; color: #FF8090; }
.dark-quote { font-size: 19px; font-weight: 200; font-style: italic; color: #eee; border-left: 2px solid #B01020; padding-left: 20px; margin-bottom: 20px; line-height: 1.7; }
.dark-text { font-size: 16px; font-weight: 300; color: #aaa; line-height: 2; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; margin-top: 44px; }
.step-n { font-size: 44px; font-weight: 100; color: #e0ddd4; line-height: 1; margin-bottom: 10px; }
.step-t { font-size: 15px; font-weight: 400; margin-bottom: 8px; }
.step-d { font-size: 14px; font-weight: 300; color: #888; line-height: 1.8; }
.about { background: #EDEAE2; padding: 72px 60px; display: flex; gap: 80px; align-items: center; }
.about-text { font-size: 16px; font-weight: 300; color: #555; line-height: 2; margin-bottom: 14px; }
.badge { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 3px; color: #B01020; text-transform: uppercase; border: 0.5px solid #B01020; padding: 7px 14px; border-radius: 24px; margin-top: 14px; }
.dl { padding: 72px 60px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.dl-title { font-size: 44px; font-weight: 200; letter-spacing: -1px; margin-bottom: 14px; }
.dl-sub { font-size: 16px; font-weight: 300; color: #888; margin-bottom: 36px; }
.store { display: inline-flex; align-items: center; gap: 10px; background: #1A1A1A; color: white; padding: 14px 26px; border-radius: 12px; cursor: pointer; border: none; }
.store-s { font-size: 10px; color: #aaa; letter-spacing: 1px; display: block; }
.store-m { font-size: 15px; font-weight: 400; display: block; }
.footer { border-top: 0.5px solid #ddd; padding: 28px 60px; display: flex; justify-content: space-between; align-items: center; }
.footer-copy { font-size: 12px; color: #bbb; }
.footer-links { display: flex; gap: 20px; }
.footer-links a { font-size: 12px; color: #bbb; text-decoration: none; }

/* MOBILE */
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
.hamburger span { display: block; width: 22px; height: 1.5px; background: #1A1A1A; }
.mobile-menu { display: none; flex-direction: column; background: #F5F3EE; border-bottom: 0.5px solid #ddd; padding: 16px 24px 24px; gap: 16px; }
.mobile-menu a { font-size: 13px; letter-spacing: 1.5px; color: #888; text-decoration: none; text-transform: uppercase; }
.mobile-menu .nav-cta { align-self: flex-start; margin-top: 8px; }
.mobile-menu.open { display: flex; }
.mobile-lang { display: flex; gap: 8px; padding-top: 4px; }

@media (max-width: 768px) {
  .nav { padding: 16px 24px; }
  .nav-links { display: none; }
  .nav-cta { display: none; }
  .lang-switcher { display: none; }
  .hamburger { display: flex; }

  .hero { flex-direction: column; padding: 48px 24px 40px; min-height: auto; gap: 40px; text-align: center; }
  .hero-left { max-width: 100%; }
  .hero-title { font-size: 36px; }
  .hero-desc { font-size: 16px; max-width: 100%; }
  .hero-actions { justify-content: center; }
  .hero-right { width: 100%; }

  .divider { margin: 0 24px; }
  .section { padding: 48px 24px; }
  .sec-title { font-size: 26px; }
  .sec-desc { font-size: 16px; max-width: 100%; }
  .grid { grid-template-columns: 1fr; }

  .dark { padding: 48px 24px; }
  .dark-inner { flex-direction: column; gap: 32px; }
  .dark-title { font-size: 26px; }
  .dark-quote { font-size: 16px; }
  .dark-text { font-size: 15px; }

  .steps { grid-template-columns: 1fr 1fr; gap: 24px; }

  .about { flex-direction: column; padding: 48px 24px; gap: 40px; }
  .about svg { width: 100%; max-width: 280px; height: auto; }

  .dl { padding: 48px 24px; }
  .dl-title { font-size: 30px; }

  .footer { flex-direction: column; gap: 16px; text-align: center; padding: 24px; }
}

@media (max-width: 480px) {
  .hero-title { font-size: 30px; }
  .steps { grid-template-columns: 1fr; }
  .phone { width: 180px; height: 360px; }
}
</style>

let currentLang = 'pt';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;

  // Update all text nodes
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key] !== undefined) el.textContent = i18n[lang][key];
  });

  // Update HTML nodes (for italic/br tags)
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (i18n[lang][key] !== undefined) el.innerHTML = i18n[lang][key];
  });

  // Update active lang button (both desktop and mobile)
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
  });
}

function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
