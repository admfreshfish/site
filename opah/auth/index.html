<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opah – Autenticando…</title>
  <!--
    OAuth intermediary page — intentionally NOT in apple-app-site-association.
    On iOS Safari, signInWithRedirect is unreliable because:
      1. sessionStorage may be wiped when the tab navigates through foreign origins.
      2. Firebase's iframe credential relay can be blocked by ITP.
    Solution: on iOS, show a "Tap to continue" button and use signInWithPopup.
    The popup stays at auth.freshfishdigital.com (same-site subdomain), calls
    window.close() + postMessage, and never navigates to /opah/join — so
    Universal Links are not triggered.
    On non-iOS (Android/desktop): keep the redirect flow.
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; background: #111; color: #eee;
           font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #444;
               border-top-color: #f5a623; border-radius: 50%;
               animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wrap { text-align: center; padding: 24px; max-width: 320px; }
    .err  { color: #ff6b6b; margin-top: 12px; font-size: 13px; }
    .btn-continue {
      display: none; margin-top: 24px; width: 100%;
      padding: 14px 20px; border: none; border-radius: 12px;
      background: #f5a623; color: #111; font-size: 16px; font-weight: 700;
      cursor: pointer; letter-spacing: .3px;
    }
    .btn-continue:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spinner"></div>
    <p id="msg">Autenticando…</p>
    <button class="btn-continue" id="btn-continue">Toque para continuar</button>
    <p id="err" class="err" style="display:none;"></p>
  </div>

  <!-- Non-module fallback: if the ES module never executes, show error after 15 s -->
  <script>
    setTimeout(function() {
      var el = document.getElementById('msg');
      if (el && el.textContent === 'Autenticando\u2026') {
        el.textContent = 'Erro ao carregar. Volte e tente novamente.';
        document.getElementById('err').style.display = '';
        document.getElementById('err').textContent   = 'Script do Firebase não carregou (rede ou cache).';
      }
    }, 15000);
  </script>

  <script type="module">
    import { initializeApp }     from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
    import {
      getAuth, getRedirectResult, onAuthStateChanged,
      signInWithRedirect, signInWithPopup,
      GoogleAuthProvider,
      FacebookAuthProvider,
      OAuthProvider,
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';

    const app  = initializeApp({
      apiKey:            'AIzaSyDUaVe5R83dkPietk9z08klk8AOFikFo-8',
      authDomain:        'auth.freshfishdigital.com',
      projectId:         'opah-a618d',
      storageBucket:     'opah-a618d.firebasestorage.app',
      messagingSenderId: '963795818634',
      appId:             '1:963795818634:web:98545eb3ba6c907dd6f573',
    });
    const auth = getAuth(app);

    // ── URL / sessionStorage params ───────────────────────────────────
    const SS_EVENT    = 'opah_auth_event';
    const SS_PROVIDER = 'opah_auth_provider';
    const SS_RETURNING = 'opah_auth_returning';

    const params      = new URLSearchParams(location.search);
    const eventId     = params.get('event')    || sessionStorage.getItem(SS_EVENT)    || '';
    const providerKey = params.get('provider') || sessionStorage.getItem(SS_PROVIDER) || '';

    if (eventId)     sessionStorage.setItem(SS_EVENT,    eventId);
    if (providerKey) sessionStorage.setItem(SS_PROVIDER, providerKey);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    function joinUrl() {
      const ev = sessionStorage.getItem(SS_EVENT) || eventId;
      return ev ? `/opah/join?event=${encodeURIComponent(ev)}` : '/opah/join';
    }

    function makeProvider(type) {
      if (type === 'google') return new GoogleAuthProvider();
      if (type === 'facebook') {
        const p = new FacebookAuthProvider(); p.addScope('email'); return p;
      }
      if (type === 'apple') {
        const p = new OAuthProvider('apple.com');
        p.addScope('email'); p.addScope('name'); return p;
      }
      return null;
    }

    function goBack(hash) {
      sessionStorage.removeItem(SS_EVENT);
      sessionStorage.removeItem(SS_PROVIDER);
      sessionStorage.removeItem(SS_RETURNING);
      // Programmatic JS navigation — does NOT trigger iOS Universal Links ✓
      window.location.replace(joinUrl() + (hash || ''));
    }

    function showErr(msg) {
      document.getElementById('err').style.display = '';
      document.getElementById('err').textContent   = msg;
    }
    function setMsg(t) { document.getElementById('msg').textContent = t; }
    function onErr(e) {
      console.error('auth error', e.code, e.message);
      showErr((e.message || 'Erro de autenticação.') + (e.code ? ` (${e.code})` : ''));
      setTimeout(() => goBack('#autherror=' + encodeURIComponent(e.code || 'unknown')), 4000);
    }

    // ── iOS path: signInWithPopup from a user-gesture button ─────────
    //
    // signInWithRedirect on iOS Safari is unreliable: sessionStorage can be
    // wiped when the browser navigates through cross-origin URLs, and the
    // iframe-based credential relay is blocked by ITP even for subdomains.
    //
    // With authDomain = auth.freshfishdigital.com, signInWithPopup opens a
    // tab that stays on that subdomain, completes auth, then calls
    // window.close() + postMessage — never navigating to /opah/join, so
    // Universal Links are never triggered.
    //
    // The only catch: window.open must be called synchronously inside a
    // user-gesture handler (iOS popup blocking). We satisfy this by showing
    // the "Toque para continuar" button and calling signInWithPopup directly
    // inside its click handler.

    if (isIOS) {
      const p = makeProvider(providerKey);
      if (!p) { goBack(); }
      else {
        const label = providerKey === 'google' ? 'Google'
                    : providerKey === 'facebook' ? 'Facebook'
                    : providerKey === 'apple' ? 'Apple'
                    : 'conta';

        setMsg('Toque no botão para continuar.');
        document.getElementById('spinner').style.display = 'none';

        const btn = document.getElementById('btn-continue');
        btn.textContent = `Continuar com ${label}`;
        btn.style.display = 'block';

        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Aguarde…';
          document.getElementById('spinner').style.display = '';
          setMsg('Abrindo login…');
          try {
            await signInWithPopup(auth, p);
            goBack(); // ✓ signed in — return to join page
          } catch (e) {
            if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
              // User closed — just go back without an error
              goBack();
            } else {
              onErr(e);
            }
          }
        });
      }

    // ── Non-iOS path: signInWithRedirect (works reliably on Android / desktop) ──
    } else {
      const isReturning = sessionStorage.getItem(SS_RETURNING) === '1';

      if (!isReturning) {
        // FIRST LOAD — initiate redirect
        const p = makeProvider(providerKey);
        if (!p) { goBack(); }
        else {
          setMsg('Redirecionando…');
          sessionStorage.setItem(SS_RETURNING, '1');
          signInWithRedirect(auth, p).catch(e => {
            sessionStorage.removeItem(SS_RETURNING);
            onErr(e);
          });
        }

      } else {
        // RETURN LOAD — wait for Firebase to process the redirect result
        sessionStorage.removeItem(SS_RETURNING);
        setMsg('Verificando conta…');

        // Race:  A) onAuthStateChanged (real user)  vs  B) getRedirectResult
        // If getRedirectResult rejects, surface the real Firebase error code.
        let settled = false;
        const realUser = await new Promise((resolve, reject) => {
          const t = setTimeout(() => { if (!settled) { settled = true; resolve(null); } }, 10000);

          onAuthStateChanged(auth, user => {
            if (!settled && user && !user.isAnonymous) {
              settled = true; clearTimeout(t); resolve(user);
            }
          });

          getRedirectResult(auth)
            .then(r => {
              if (!settled && r && r.user && !r.user.isAnonymous) {
                settled = true; clearTimeout(t); resolve(r.user);
              }
            })
            .catch(err => {
              if (!settled) { settled = true; clearTimeout(t); reject(err); }
            });
        });

        if (realUser) { goBack(); }
        else          { goBack('#autherror=no-result'); }
      }
    }
  </script>
</body>
</html>
