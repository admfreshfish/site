<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Entrar no evento · Opah</title>
    <meta
      name="description"
      content="Baixe o Opah para entrar no seu evento."
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#100E0C" />
    <!--
      Shows Safari's "Smart App Banner" when the app is installed. Replace
      YOUR_APPSTORE_ID once Opah has an App Store listing (see
      web_landing/README.md). Tapping the banner is the ONLY reliable way
      to re-hand off to the app from inside Safari — so keep this meta tag.
    -->
    <meta
      name="apple-itunes-app"
      content="app-id=YOUR_APPSTORE_ID, app-argument=event"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #ffb74d;
        --brand-dark: #e6a23c;
        --ink: #1a1714;
        --fg: #f5efe8;
        --muted: #b5a89c;
        --card: rgba(28, 24, 21, 0.72);
        --card-border: rgba(255, 255, 255, 0.08);
        --chip: rgba(255, 255, 255, 0.06);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #100e0c;
        color: var(--fg);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        /* Warm radial glow matching the in-app invite card. */
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(120% 90% at 85% -10%, #4a3020 0%, rgba(74, 48, 32, 0) 55%),
          radial-gradient(110% 80% at 50% 120%, #2a1d14 0%, rgba(42, 29, 20, 0) 60%);
        pointer-events: none;
        z-index: 0;
      }
      main {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 22px 56px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 40px 28px 32px;
        text-align: center;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .logo {
        width: 84px;
        height: 84px;
        margin: 0 auto 22px;
        border-radius: 24px;
        background: linear-gradient(150deg, #ffce85 0%, var(--brand) 45%, var(--brand-dark) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 42px;
        color: #2a1a08;
        box-shadow: 0 10px 28px rgba(255, 183, 77, 0.35);
      }
      h1 {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.2px;
        line-height: 1.15;
      }
      p.subtitle {
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        max-width: 280px;
      }

      .cta {
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 15px 18px;
        border-radius: 14px;
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--fg);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease;
      }
      .btn:active { transform: scale(0.985); }
      .btn .icon { width: 18px; height: 18px; flex: none; }
      .btn.secondary:hover { background: rgba(255, 255, 255, 0.08); }
      .btn.primary {
        background: linear-gradient(135deg, #ffc46b 0%, var(--brand) 100%);
        color: #2a1a08;
        border-color: transparent;
        box-shadow: 0 12px 26px rgba(255, 183, 77, 0.32);
      }
      .btn.primary:hover { box-shadow: 0 14px 32px rgba(255, 183, 77, 0.42); }
      .btn.primary:active { background: var(--brand-dark); }
      .hidden { display: none !important; }

      .event-tag {
        margin: 24px 0 0;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.2px;
      }
      .event-tag code {
        background: var(--chip);
        border: 1px solid var(--card-border);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--fg);
      }

      .footer {
        margin: 22px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="logo" aria-hidden="true">O</div>
        <h1>Entrar no evento</h1>
        <p class="subtitle">
          Baixe o app Opah para ver o convite e participar.
        </p>

        <div class="cta">
          <a id="open-app" class="btn primary hidden" href="#">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Abrir no app
          </a>
          <a id="ios-store" class="btn secondary" href="#" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M16.4 12.9c0-2 1.6-3 1.7-3.1-.9-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.2 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 .9 0 1.3-.6 2.4-.6 1.1 0 1.4.6 2.4.6 1 0 1.6-.9 2.3-1.9.5-.7.7-1.1 1.1-2-2.9-1.1-3.1-4.8.4-3.4zM14.6 6.3c.5-.6.8-1.5.7-2.3-.7 0-1.6.5-2.1 1.1-.5.5-.9 1.4-.8 2.2.8.1 1.6-.4 2.2-1z"/>
            </svg>
            Baixar no iPhone
          </a>
          <a id="android-store" class="btn secondary" href="#" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 20.5V9.5c0-.4.5-.7.9-.5l9.6 5.5c.4.2.4.8 0 1L3.9 21c-.4.2-.9-.1-.9-.5zM15.3 13.4l2.4-1.4c.5-.3.5-1 0-1.3l-2.4-1.4-2 2.1 2 2zM5 3.7l8 4.6-1.8 1.9L4.6 4.6c-.3-.2-.2-.7.4-.9zm0 16.6c-.6.2-.7-.3-.4-.5l6.6-5.6 1.8 1.9-8 4.2z"/>
            </svg>
            Baixar no Android
          </a>
        </div>

        <p id="event-info" class="event-tag"></p>
      </div>
      <p class="footer">Já tem o app? Abra o Opah pelo ícone na tela inicial.</p>
    </main>

    <script>
      var params = new URLSearchParams(location.search);
      var eventId = params.get('event') || params.get('id') || '';

      var APP_STORE_URL = 'https://apps.apple.com/app/idYOUR_APPSTORE_ID';
      var PLAY_STORE_URL =
        'https://play.google.com/store/apps/details?id=com.freshfishdigital.opah';

      document.getElementById('ios-store').href = APP_STORE_URL;
      document.getElementById('android-store').href = PLAY_STORE_URL;

      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /Android/.test(ua);

      if (isIOS) document.getElementById('android-store').classList.add('hidden');
      if (isAndroid) document.getElementById('ios-store').classList.add('hidden');
      // On desktop show both store links.

      // Custom-scheme fallback: when the page is opened inside Safari/Chrome
      // (e.g. iOS Camera also opening Safari in parallel with the Universal
      // Link handoff), a same-domain link/reload won't re-trigger the Universal
      // Link. The opah:// scheme DOES hand off from inside the browser, so we
      // show an "Abrir no app" button on mobile.
      if ((isIOS || isAndroid) && eventId) {
        var openBtn = document.getElementById('open-app');
        openBtn.href = 'opah://join?event=' + encodeURIComponent(eventId);
        openBtn.classList.remove('hidden');
      }

      if (eventId) {
        document.getElementById('event-info').innerHTML =
          'ID do evento: <code>' + escapeHtml(eventId) + '</code>';
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    </script>
  </body>
</html>
